[package]
name = "rustpotter"
version = "3.0.3-candle-0.10"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
description = "An open source wakeword spotter forged in rust."
authors = ["Miguel Álvarez Díez <miguelwork92@gmail.com>"]
repository = "https://github.com/GiviMAD/rustpotter"
homepage = "https://github.com/Brainwires/rustpotter"
documentation = "https://docs.rs/rustpotter"
keywords = ["wakeword", "audio", "speech", "voice", "detection"]
categories = ["multimedia::audio", "algorithms"]
exclude = [
    ".vscode/*",
    "tests/*",
    "tools/*",
    "square-icon.png",
]

[dependencies]
candle-core = "0.10"
candle-nn = "0.10"
ciborium = "0.2.1"
hound = "3.4.5"
rubato = { version = "0.14.1", default-features = false }
rustfft = { version = "6.1.0", default-features = false }
serde =  { version = "1.0.188", features = ["derive"], default-features = false }

[features]
default = ["debug"]
debug = []
display = []
audio = []
record = []

